name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: mobile-native/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Unit tests
        run: npm test
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/AAKAASH-ADHINAYAK-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAKAASH-ADHINAYAK-debug-APK
          path: mobile-native/artifacts/AAKAASH-ADHINAYAK-debug.apk
          if-no-files-found: error
          retention-days: 30
