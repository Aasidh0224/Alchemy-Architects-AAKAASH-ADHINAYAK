name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable sideload APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: mobile-native/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Unit tests
        run: npm test
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build self-contained APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          needle = 'signingConfig signingConfigs.release'
          if needle not in s:
              raise SystemExit('Expected Expo release signing line was not found; stopping rather than building an incorrectly signed package.')
          p.write_text(s.replace(needle, 'signingConfig signingConfigs.debug', 1))
          PY
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../artifacts
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/AAKAASH-ADHINAYAK-sideload.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAKAASH-ADHINAYAK-Android-APK
          path: mobile-native/artifacts/AAKAASH-ADHINAYAK-sideload.apk
          if-no-files-found: error
          retention-days: 30
