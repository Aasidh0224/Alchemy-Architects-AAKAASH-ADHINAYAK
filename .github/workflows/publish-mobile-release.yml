name: Publish Android release assets

on:
  workflow_run:
    workflows: ["Android APK"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact source used by the successful APK build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download APK artifact from the completed Android build
        uses: actions/download-artifact@v4
        with:
          name: AAKAASH-ADHINAYAK-Android-APK
          path: dist/apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Assemble release downloads
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/apk/AAKAASH-ADHINAYAK-debug-signed.apk
          cp dist/apk/AAKAASH-ADHINAYAK-debug-signed.apk dist/AAKAASH-ADHINAYAK.apk

          # Native source archive
          mkdir -p dist/source/AAKAASH_ADHINAYAK_NATIVE_MOBILE
          cp -a mobile-native/. dist/source/AAKAASH_ADHINAYAK_NATIVE_MOBILE/
          (
            cd dist/source
            zip -qr ../AAKAASH_ADHINAYAK_NATIVE_MOBILE_SOURCE.zip AAKAASH_ADHINAYAK_NATIVE_MOBILE
          )

          # Build kit: source + workflows + instructions
          kit="dist/build-kit/AAKAASH_ADHINAYAK_APK_BUILD_KIT"
          mkdir -p "$kit/mobile-native" "$kit/.github/workflows"
          cp -a mobile-native/. "$kit/mobile-native/"
          cp .github/workflows/android-apk.yml "$kit/.github/workflows/android-apk.yml"
          cp .github/workflows/publish-mobile-release.yml "$kit/.github/workflows/publish-mobile-release.yml"
          cp README.md "$kit/README.md"
          if [ -f MOBILE_INSTALL_GUIDE.md ]; then cp MOBILE_INSTALL_GUIDE.md "$kit/MOBILE_INSTALL_GUIDE.md"; fi
          if [ -f MOBILE_RELEASE_DOWNLOADS.md ]; then cp MOBILE_RELEASE_DOWNLOADS.md "$kit/MOBILE_RELEASE_DOWNLOADS.md"; fi
          (
            cd dist/build-kit
            zip -qr ../AAKAASH_ADHINAYAK_APK_BUILD_KIT.zip AAKAASH_ADHINAYAK_APK_BUILD_KIT
          )

          cat > dist/RELEASE_NOTES.txt <<'EOF'
          AAKAASH ADHINAYAK — Android prototype release

          APK: debug-signed, for sideload testing only; not a Play Store production release.
          Source: React Native / Expo project using generic synthetic records.
          Scope: non-operational student prototype. No live military telemetry, weapon control, targeting, tactical routing or distress broadcast.
          Security: demo PIN 0224 is development-only; release authentication uses device biometric/device-credential prompts.
          Remote push requires a configured EAS project and backend sender. Cloud sync requires an authorised HTTPS service configured by the owner.
          Physical-device, security, accessibility, battery and offline tests are still required before wider distribution.
          EOF

          (
            cd dist
            sha256sum AAKAASH-ADHINAYAK.apk AAKAASH_ADHINAYAK_NATIVE_MOBILE_SOURCE.zip AAKAASH_ADHINAYAK_APK_BUILD_KIT.zip > SHA256SUMS.txt
          )

      - name: Publish APK and source downloads as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aakaash-android-build-${{ github.event.workflow_run.run_number }}
          name: "AAKAASH ADHINAYAK Android Test Build #${{ github.event.workflow_run.run_number }}"
          body_path: dist/RELEASE_NOTES.txt
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/AAKAASH-ADHINAYAK.apk
            dist/AAKAASH_ADHINAYAK_NATIVE_MOBILE_SOURCE.zip
            dist/AAKAASH_ADHINAYAK_APK_BUILD_KIT.zip
            dist/SHA256SUMS.txt
