<text x="40" y="202" class="sect">CORE WORKFLOW / FROM INPUT TO EXPLAINABLE CANDIDATE</text>
<!-- main five-stage cards -->
<g><rect x="35" y="225" width="282" height="248" rx="15" class="tile" stroke="#39bfe0"/><rect x="35" y="225" width="282" height="7" rx="3" fill="#36cce3"/><text x="58" y="265" class="num" fill="#5de1ef">01</text><text x="110" y="265" class="head">INGEST</text><path d="M58 283H293" class="edge"/><text x="58" y="313" class="body">Public source adapters</text><text x="58" y="339" class="body">CSV / JSON task intake</text><text x="58" y="375" class="small">Publisher · Endpoint · Terms</text><text x="58" y="398" class="small">Retrieval &amp; observation times</text><g transform="translate(73 418)" fill="none" stroke="#58dced" stroke-width="2"><ellipse cx="26" cy="6" rx="23" ry="8"/><path d="M3 6V31C3 42 49 42 49 31V6M3 18C3 29 49 29 49 18M3 30C3 40 49 40 49 30"/></g><text x="143" y="447" class="small">Traceable inputs</text></g>
<g><rect x="348" y="225" width="282" height="248" rx="15" class="tile" stroke="#43d8b7"/><rect x="348" y="225" width="282" height="7" rx="3" fill="#4ce2bc"/><text x="371" y="265" class="num" fill="#4ce2bc">02</text><text x="423" y="265" class="head">VALIDATE</text><path d="M371 283H606" class="edge"/><text x="371" y="313" class="body">Schema &amp; field types</text><text x="371" y="339" class="body">Missing / duplicate values</text><text x="371" y="365" class="body">Freshness &amp; contradictions</text><text x="371" y="398" class="small">Unknown is never assumed valid</text><g transform="translate(380 416)" fill="none" stroke="#51dfbd" stroke-width="2"><rect width="28" height="31" rx="5"/><path d="M7 16L12 21L22 9"/></g><text x="423" y="437" class="small">Data quality gate</text></g>
<g><rect x="661" y="225" width="282" height="248" rx="15" class="tile" stroke="#ffc96b"/><rect x="661" y="225" width="282" height="7" rx="3" fill="#ffc96b"/><text x="684" y="265" class="num" fill="#ffc96b">03</text><text x="736" y="265" class="head">OPTIMISE</text><path d="M684 283H919" class="edge"/><text x="684" y="313" class="body">Generic capacity constraints</text><text x="684" y="339" class="body">Priority / deadline heuristic</text><text x="684" y="365" class="body">Availability / maintenance</text><text x="684" y="398" class="small">Candidate, not a proven optimum</text><g stroke="#ffc96b" stroke-width="2" fill="#ffc96b"><path d="M703 434L735 411L761 440L793 415L819 441L848 414L882 433" stroke="#ffc96b" fill="none"/><circle cx="703" cy="434" r="4"/><circle cx="735" cy="411" r="4"/><circle cx="761" cy="440" r="4"/><circle cx="793" cy="415" r="4"/><circle cx="819" cy="441" r="4"/><circle cx="848" cy="414" r="4"/><circle cx="882" cy="433" r="4"/></g></g>
<g><rect x="974" y="225" width="282" height="248" rx="15" class="tile" stroke="#b59aff"/><rect x="974" y="225" width="282" height="7" rx="3" fill="#b59aff"/><text x="997" y="265" class="num" fill="#b59aff">04</text><text x="1049" y="265" class="head">VERIFY</text><path d="M997 283H1232" class="edge"/><text x="997" y="313" class="body">Independent rule checks</text><text x="997" y="339" class="body">No double-booking</text><text x="997" y="365" class="body">Capacity / times / task coverage</text><text x="997" y="398" class="small">Pass / fail / review state</text><g transform="translate(1000 415)" stroke="#b59aff" stroke-width="2" fill="none"><rect width="32" height="37" rx="5"/><path d="M7 12L11 16L18 8M7 25L11 29L18 21M22 12H27M22 25H27"/></g><text x="1049" y="438" class="small">Hard constraints rechecked</text></g>
<g><rect x="1287" y="225" width="278" height="248" rx="15" class="tile" stroke="#43d2e9"/><rect x="1287" y="225" width="278" height="7" rx="3" fill="#43d2e9"/><text x="1310" y="265" class="num" fill="#43d2e9">05</text><text x="1362" y="265" class="head">EXPLAIN</text><path d="M1310 283H1541" class="edge"/><text x="1310" y="313" class="body">VAYU NEXA AI helper</text><text x="1310" y="339" class="body">Record-grounded explanation</text><text x="1310" y="365" class="body">Run &amp; evidence export</text><text x="1310" y="398" class="small">No external LLM in this edition</text><g transform="translate(1310 414)" stroke="#49d7e9" fill="none" stroke-width="2"><circle cx="17" cy="17" r="14"/><path d="M6 13L17 5L28 13L17 25Z M17 5V25 M6 13H28"/></g><text x="1356" y="438" class="small">Transparent unknowns</text></g>
<g stroke="#44d4e9" stroke-width="4" fill="none"><path d="M318 349H344l-10 -8m10 8l-10 8"/><path d="M631 349H657l-10 -8m10 8l-10 8"/><path d="M944 349H970l-10 -8m10 8l-10 8"/><path d="M1257 349H1283l-10 -8m10 8l-10 8"/></g>
<!-- replanning loop -->
<rect x="38" y="497" width="1524" height="76" rx="16" fill="#0b2134" stroke="#2c728c" stroke-width="1.5"/><circle cx="79" cy="535" r="17" stroke="#55d9eb" stroke-width="3" fill="none"/><path d="M68 528A13 13 0 0 1 91 526M90 526L91 517M90 526L82 526M90 543A13 13 0 0 1 67 543M68 543L67 551M68 543L76 543" stroke="#55d9eb" stroke-width="2" fill="none"/><text x="116" y="530" class="head">DYNAMIC REPLANNING LOOP</text><text x="116" y="552" class="small">Controlled synthetic disruption</text><g class="body" font-weight="700"><text x="485" y="541">DISRUPT</text><text x="603" y="541" fill="#55d9eb">→</text><text x="628" y="541">RERUN</text><text x="733" y="541" fill="#55d9eb">→</text><text x="758" y="541">VERIFY</text><text x="858" y="541" fill="#55d9eb">→</text><text x="882" y="541">COMPARE</text><text x="1000" y="541" fill="#55d9eb">→</text><text x="1025" y="541">HUMAN REVIEW</text></g><text x="1324" y="541" class="small">Retain prior runs</text>
<!-- bottom four feature cards -->
<g><rect x="38" y="599" width="361" height="173" rx="14" class="tile"/><text x="60" y="633" class="head" font-size="18">DATA &amp; PROVENANCE</text><text x="60" y="663" class="body">Publisher · source · timestamps</text><text x="60" y="688" class="body">PUBLIC / HISTORICAL / SYNTHETIC</text><text x="60" y="725" class="small">Import snapshots · schema version · freshness</text></g>
<g><rect x="417" y="599" width="361" height="173" rx="14" class="tile"/><text x="439" y="633" class="head" font-size="18">OPTIMISATION EVIDENCE</text><text x="439" y="663" class="body">Run ID · inputs · objective · runtime</text><text x="439" y="688" class="body">Assigned &amp; unassigned tasks</text><text x="439" y="725" class="small">Independent validator and machine-readable export</text></g>
<g><rect x="796" y="599" width="361" height="173" rx="14" class="tile"/><text x="818" y="633" class="head" font-size="18">TRUST &amp; GOVERNANCE</text><text x="818" y="663" class="body">Human review · transparent limits</text><text x="818" y="688" class="body">Unknowns · session events · role plan</text><text x="818" y="725" class="small">No server persistence or auth in this demo</text></g>
<g><rect x="1175" y="599" width="387" height="173" rx="14" class="tile"/><text x="1197" y="633" class="head" font-size="18">VISUAL INTELLIGENCE</text><text x="1197" y="663" class="body">Interactive evidence graph · planned</text><text x="1197" y="688" class="body">Readable 2D alternative</text><text x="1197" y="725" class="small">Visual layer must reflect real application state</text></g>
<rect x="38" y="797" width="1524" height="57" rx="12" fill="#0b1c2b" stroke="#2c718b"/><text x="60" y="831" class="sect">ENGINEERING ACCEPTANCE GATES</text><g><rect x="363" y="809" width="205" height="33" rx="7" fill="#102d43" stroke="#286f8d"/><text x="381" y="830" font-size="13" font-weight="700">01 · Import tests</text><rect x="580" y="809" width="224" height="33" rx="7" fill="#102d43" stroke="#286f8d"/><text x="597" y="830" font-size="13" font-weight="700">02 · Feasible / infeasible</text><rect x="816" y="809" width="223" height="33" rx="7" fill="#102d43" stroke="#286f8d"/><text x="833" y="830" font-size="13" font-weight="700">03 · Reject invalid plan</text><rect x="1051" y="809" width="200" height="33" rx="7" fill="#102d43" stroke="#286f8d"/><text x="1067" y="830" font-size="13" font-weight="700">04 · Replay scenario</text><rect x="1263" y="809" width="276" height="33" rx="7" fill="#102d43" stroke="#286f8d"/><text x="1281" y="830" font-size="13" font-weight="700">05 · Export evidence</text></g>
<text x="800" y="883" text-anchor="middle" class="small">Non-operational, human-reviewed student prototype · Public data only after source verification · Synthetic fixtures clearly labelled</text>
