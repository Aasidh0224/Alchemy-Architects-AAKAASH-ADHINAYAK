<title id="title">AAKAASH ADHINAYAK — Technical Approach</title><desc id="desc">Evidence-to-decision pipeline for a safe, non-operational student resource-planning prototype, including provenance, deterministic planning, independent validation, replanning and evidence export.</desc>
